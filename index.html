<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CineWick - Generador Master de Embeds</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eef2ff',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
              900: '#312e81',
            }
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .aspect-21-9 { aspect-ratio: 21 / 9; }
    .aspect-16-9 { aspect-ratio: 16 / 9; }
    .aspect-4-3 { aspect-ratio: 4 / 3; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans antialiased flex flex-col">

  <!-- Header -->
  <header class="border-b border-slate-800 bg-slate-900/80 backdrop-blur sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="bg-gradient-to-tr from-brand-600 to-indigo-400 p-2.5 rounded-xl shadow-lg shadow-brand-500/20">
          <i class="fa-solid fa-play text-xl text-white"></i>
        </div>
        <div>
          <div class="flex items-center space-x-2">
            <h1 class="text-xl font-bold tracking-tight text-white">CineWick</h1>
            <span class="text-[10px] bg-brand-500/20 text-brand-400 border border-brand-500/30 px-2 py-0.5 rounded-full font-mono">cinewick.shop</span>
          </div>
          <p class="text-xs text-slate-400">Generador Master con actualización automática en vivo</p>
        </div>
      </div>
      <div class="flex items-center space-x-2">
        <button id="resetFormBtn" class="text-xs px-3 py-1.5 rounded-lg border border-slate-700 hover:bg-slate-800 transition text-slate-300">
          <i class="fa-solid fa-rotate-left mr-1"></i> Reiniciar
        </button>
      </div>
    </div>
  </header>

  <!-- Main Grid -->
  <main class="max-w-7xl mx-auto px-4 py-8 flex-1 w-full grid grid-cols-1 lg:grid-cols-12 gap-8">
    
    <!-- Controls Column (Left) -->
    <section class="lg:col-span-5 space-y-6">
      
      <!-- Content Type & Identifiers -->
      <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 space-y-4">
        <h2 class="text-sm font-semibold uppercase tracking-wider text-brand-400 flex items-center">
          <i class="fa-solid fa-clapperboard mr-2"></i> Configuración del Player
        </h2>
        
        <!-- Type Selection Buttons -->
        <div class="grid grid-cols-2 gap-2 bg-slate-950 p-1.5 rounded-xl border border-slate-800/80">
          <button id="typeMovieBtn" type="button" class="py-2 px-4 rounded-lg text-sm font-medium transition bg-brand-600 text-white shadow">
            <i class="fa-solid fa-film mr-2"></i> Película
          </button>
          <button id="typeTvBtn" type="button" class="py-2 px-4 rounded-lg text-sm font-medium transition text-slate-400 hover:text-white">
            <i class="fa-solid fa-tv mr-2"></i> Serie / TV
          </button>
        </div>

        <!-- Buscador TMDB por Nombre -->
        <div class="relative">
          <label class="block text-xs font-medium text-slate-400 mb-1">Buscar por Nombre (TMDB)</label>
          <div class="relative">
            <input type="text" id="searchInput" placeholder="Buscar título en TMDB..." class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:border-brand-500 text-slate-200">
            <span class="absolute right-3 top-3 text-slate-500 text-xs"><i class="fa-solid fa-magnifying-glass"></i></span>
          </div>
          <!-- Resultados flotantes -->
          <div id="searchResults" class="absolute left-0 right-0 mt-1 bg-slate-950 border border-slate-800 rounded-xl shadow-2xl z-50 max-h-56 overflow-y-auto hidden"></div>
        </div>

        <!-- Servidor / Motor Latino -->
        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1">Servidor de Contenido (Latino / Español)</label>
          <select id="serverSelect" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:border-brand-500 text-slate-200">
            <option value="vimeus">Vimeus (Recomendado Latino)</option>
            <option value="embed69">Embed69 (Usa IMDb ID)</option>
            <option value="unlimplay">Unlimplay (TMDB ID)</option>
          </select>
        </div>

        <!-- IDs Input Grid -->
        <div class="grid grid-cols-1 gap-3">
          <div>
            <label id="mediaIdLabel" class="block text-xs font-medium text-slate-400 mb-1">TMDB ID</label>
            <input type="text" id="mediaIdInput" value="550" placeholder="Ej: 550" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-brand-500 text-slate-200 font-mono">
          </div>

          <!-- Campo Extra para IMDb ID (Solo visible si se selecciona Embed69) -->
          <div id="imdbInputContainer" class="hidden">
            <label class="block text-xs font-medium text-brand-400 mb-1">IMDb ID para Embed69 (ej: tt0137523)</label>
            <input type="text" id="imdbIdInput" placeholder="tt0137523" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-brand-500 text-slate-200 font-mono">
          </div>
        </div>

        <!-- Botón para forzar actualización/reinicio de Vista Previa -->
        <button id="refreshPreviewBtn" type="button" class="w-full bg-slate-800 hover:bg-slate-700 text-brand-400 border border-brand-500/30 font-medium text-xs py-2.5 rounded-xl transition flex items-center justify-center space-x-2">
          <i class="fa-solid fa-arrows-rotate"></i>
          <span>Cargar / Reiniciar Vista Previa</span>
        </button>
      </div>

      <!-- SECCIÓN DE TEMPORADAS Y EPISODIOS -->
      <div id="tvSelectorSection" class="hidden bg-slate-900 border border-slate-800 rounded-2xl p-5 space-y-4">
        <div class="flex items-center justify-between">
          <h2 class="text-sm font-semibold uppercase tracking-wider text-brand-400 flex items-center">
            <i class="fa-solid fa-layer-group mr-2"></i> Temporadas y Episodios
          </h2>
          <span id="episodesCountBadge" class="text-[10px] bg-slate-800 text-slate-300 px-2 py-0.5 rounded-full font-mono">12 Episodios</span>
        </div>

        <!-- Selector Horizontal de Temporadas -->
        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1.5">Seleccionar Temporada</label>
          <div id="seasonsPillsContainer" class="flex space-x-2 overflow-x-auto pb-2 scrollbar-thin"></div>
        </div>

        <!-- Grid Elegante de Tarjetas de Episodios -->
        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1.5">Episodio Activo</label>
          <div id="episodesGrid" class="grid grid-cols-3 sm:grid-cols-4 gap-2 max-h-64 overflow-y-auto pr-1"></div>
        </div>
      </div>

      <!-- Player Customization -->
      <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 space-y-4">
        <h2 class="text-sm font-semibold uppercase tracking-wider text-brand-400 flex items-center">
          <i class="fa-solid fa-sliders mr-2"></i> Dimensiones y Ajustes
        </h2>

        <!-- Responsiveness Toggle -->
        <div class="flex items-center justify-between py-1">
          <span class="text-xs font-medium text-slate-300">Contenedor Responsivo</span>
          <label class="relative inline-flex items-center cursor-pointer">
            <input type="checkbox" id="responsiveToggle" class="sr-only peer" checked>
            <div class="w-11 h-6 bg-slate-950 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-brand-600"></div>
          </label>
        </div>

        <!-- Aspect Ratio Options -->
        <div id="aspectRatioGroup">
          <label class="block text-xs font-medium text-slate-400 mb-1">Proporción de Aspecto</label>
          <div class="grid grid-cols-3 gap-2">
            <button type="button" data-aspect="16-9" class="aspect-btn active py-1.5 rounded-lg border text-xs font-medium border-brand-500 bg-brand-500/10 text-brand-400">16:9 Standard</button>
            <button type="button" data-aspect="21-9" class="aspect-btn py-1.5 rounded-lg border text-xs font-medium border-slate-800 bg-slate-950 text-slate-400">21:9 Cinema</button>
            <button type="button" data-aspect="4-3" class="aspect-btn py-1.5 rounded-lg border text-xs font-medium border-slate-800 bg-slate-950 text-slate-400">4:3 TV</button>
          </div>
        </div>

        <!-- Fixed Size Inputs -->
        <div id="fixedSizeGroup" class="hidden grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-medium text-slate-400 mb-1">Ancho (Width)</label>
            <input type="text" id="widthInput" value="100%" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-brand-500 text-slate-200">
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-400 mb-1">Alto (Height)</label>
            <input type="text" id="heightInput" value="500px" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-brand-500 text-slate-200">
          </div>
        </div>

        <!-- Checkbox Options -->
        <div class="space-y-2 pt-2 border-t border-slate-800/80">
          <label class="flex items-center space-x-2 text-xs text-slate-300 cursor-pointer">
            <input type="checkbox" id="allowFullscreenCheck" checked class="rounded bg-slate-950 border-slate-800 text-brand-600 focus:ring-brand-500">
            <span>Permitir Pantalla Completa (allowfullscreen)</span>
          </label>
          <label class="flex items-center space-x-2 text-xs text-slate-300 cursor-pointer">
            <input type="checkbox" id="lazyLoadingCheck" checked class="rounded bg-slate-950 border-slate-800 text-brand-600 focus:ring-brand-500">
            <span>Carga Diferida (loading="lazy")</span>
          </label>
          <label class="flex items-center space-x-2 text-xs text-slate-300 cursor-pointer">
            <input type="checkbox" id="sandboxCheck" class="rounded bg-slate-950 border-slate-800 text-brand-600 focus:ring-brand-500">
            <span>Activar Sandbox Básico (Anti-Popups)</span>
          </label>
        </div>
      </div>
    </section>

    <!-- Preview & Code Output Column (Right) -->
    <section class="lg:col-span-7 space-y-6 flex flex-col">
      
      <!-- Preview Container -->
      <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 space-y-4">
        <div class="flex items-center justify-between">
          <h2 class="text-sm font-semibold uppercase tracking-wider text-brand-400 flex items-center">
            <i class="fa-solid fa-eye mr-2"></i> Vista Previa (PlayerWeb)
          </h2>
          <!-- Device Toggle -->
          <div class="flex items-center space-x-1 bg-slate-950 p-1 rounded-lg border border-slate-800">
            <button id="deviceDesktopBtn" title="Escritorio" class="p-1.5 text-xs rounded text-brand-400 bg-slate-800">
              <i class="fa-solid fa-desktop"></i>
            </button>
            <button id="deviceMobileBtn" title="Móvil" class="p-1.5 text-xs rounded text-slate-400 hover:text-white">
              <i class="fa-solid fa-mobile-screen-button"></i>
            </button>
          </div>
        </div>

        <!-- Responsive Preview Screen Wrapper -->
        <div id="previewWrapper" class="w-full transition-all duration-300 mx-auto">
          <div id="previewContainer" class="bg-slate-950 border border-slate-800 rounded-xl overflow-hidden relative min-h-[220px] flex items-center justify-center">
            <iframe id="previewIframe" src="" class="w-full h-full border-0" allowfullscreen></iframe>
          </div>
        </div>
      </div>

      <!-- Generated Code Output -->
      <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 space-y-4 flex-1 flex flex-col">
        <div class="flex items-center justify-between">
          <div class="flex items-center space-x-3">
            <h2 class="text-sm font-semibold uppercase tracking-wider text-brand-400 flex items-center">
              <i class="fa-solid fa-code mr-2"></i> Código para cinewick.shop
            </h2>
            <!-- Format selector -->
            <div class="flex space-x-1 bg-slate-950 p-1 rounded-lg border border-slate-800">
              <button id="formatHtmlBtn" class="px-2 py-0.5 text-xs rounded text-brand-400 bg-slate-800 font-medium">HTML</button>
              <button id="formatMdBtn" class="px-2 py-0.5 text-xs rounded text-slate-400 hover:text-white font-medium">Markdown</button>
            </div>
          </div>
          
          <button id="copyCodeBtn" class="bg-brand-600 hover:bg-brand-500 text-white font-medium text-xs px-4 py-2 rounded-xl transition shadow-md flex items-center space-x-2">
            <i class="fa-regular fa-copy"></i>
            <span>Copiar Código</span>
          </button>
        </div>

        <div class="relative flex-1 min-h-[140px]">
          <textarea id="codeOutput" readonly class="w-full h-full min-h-[140px] bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs font-mono text-indigo-300 focus:outline-none resize-none leading-relaxed"></textarea>
        </div>
      </div>
    </section>

  </main>

  <!-- Notification Toast -->
  <div id="toast" class="fixed bottom-5 right-5 bg-indigo-600 text-white text-xs font-semibold px-4 py-3 rounded-xl shadow-2xl transition opacity-0 transform translate-y-2 pointer-events-none flex items-center space-x-2 z-50">
    <i class="fa-solid fa-circle-check text-sm"></i>
    <span id="toastMessage">¡Código copiado al portapapeles!</span>
  </div>

  <script>
    const API_KEY = '51800c8d9e13631a7ded6f17f363e7a5';
    const PLAYERWEB_BASE = "https://jcasastech88-tech.github.io/playerweb/";
    const VIMEUS_PARAMS = "view_key=Gy5wv-mGF6Ao_Sim1TU7MPrLGsRkiGeiuWCiuVsmbu8&title=Cinewick&theme=blue&loader=v1&playUI=v3&splash=v2&autoplay=1";

    const state = {
      mediaType: 'movie',
      server: 'vimeus',
      mediaId: '550',
      imdbId: 'tt0137523',
      season: 1,
      episode: 1,
      totalSeasons: 1,
      episodesInSeason: 12,
      responsive: true,
      aspectRatio: '16-9',
      width: '100%',
      height: '500px',
      allowFullscreen: true,
      lazyLoading: true,
      sandbox: false,
      format: 'html',
      device: 'desktop'
    };

    const typeMovieBtn = document.getElementById('typeMovieBtn');
    const typeTvBtn = document.getElementById('typeTvBtn');
    const tvSelectorSection = document.getElementById('tvSelectorSection');
    const seasonsPillsContainer = document.getElementById('seasonsPillsContainer');
    const episodesGrid = document.getElementById('episodesGrid');
    const episodesCountBadge = document.getElementById('episodesCountBadge');
    const serverSelect = document.getElementById('serverSelect');
    const mediaIdInput = document.getElementById('mediaIdInput');
    const imdbInputContainer = document.getElementById('imdbInputContainer');
    const imdbIdInput = document.getElementById('imdbIdInput');
    const searchInput = document.getElementById('searchInput');
    const searchResults = document.getElementById('searchResults');
    const refreshPreviewBtn = document.getElementById('refreshPreviewBtn');
    const responsiveToggle = document.getElementById('responsiveToggle');
    const aspectRatioGroup = document.getElementById('aspectRatioGroup');
    const fixedSizeGroup = document.getElementById('fixedSizeGroup');
    const widthInput = document.getElementById('widthInput');
    const heightInput = document.getElementById('heightInput');
    const allowFullscreenCheck = document.getElementById('allowFullscreenCheck');
    const lazyLoadingCheck = document.getElementById('lazyLoadingCheck');
    const sandboxCheck = document.getElementById('sandboxCheck');
    const previewIframe = document.getElementById('previewIframe');
    const previewContainer = document.getElementById('previewContainer');
    const previewWrapper = document.getElementById('previewWrapper');
    const codeOutput = document.getElementById('codeOutput');
    const copyCodeBtn = document.getElementById('copyCodeBtn');
    const formatHtmlBtn = document.getElementById('formatHtmlBtn');
    const formatMdBtn = document.getElementById('formatMdBtn');
    const deviceDesktopBtn = document.getElementById('deviceDesktopBtn');
    const deviceMobileBtn = document.getElementById('deviceMobileBtn');
    const resetFormBtn = document.getElementById('resetFormBtn');

    // Renderizar selector de Temporadas
    function renderSeasonsPills() {
      seasonsPillsContainer.innerHTML = '';
      for (let s = 1; s <= state.totalSeasons; s++) {
        const btn = document.createElement('button');
        btn.type = 'button';
        const isActive = s === Number(state.season);
        btn.className = `px-3.5 py-1.5 rounded-xl text-xs font-medium border flex-shrink-0 transition ${
          isActive 
            ? 'border-brand-500 bg-brand-500/10 text-brand-400 font-semibold shadow-sm' 
            : 'border-slate-800 bg-slate-950 text-slate-400 hover:text-slate-200'
        }`;
        btn.innerText = `Temporada ${s}`;
        btn.addEventListener('click', () => {
          state.season = s;
          state.episode = 1; 
          fetchSeasonEpisodeCount(state.mediaId, s);
        });
        seasonsPillsContainer.appendChild(btn);
      }
    }

    // Renderizar Grid de Episodios con actualización automática en vivo
    function renderEpisodesGrid() {
      episodesGrid.innerHTML = '';
      episodesCountBadge.innerText = `${state.episodesInSeason} Episodios`;

      for (let e = 1; e <= state.episodesInSeason; e++) {
        const isActive = e === Number(state.episode);
        const card = document.createElement('div');
        card.className = `p-2.5 rounded-xl border cursor-pointer transition flex flex-col justify-between space-y-2 ${
          isActive 
            ? 'border-brand-500 bg-brand-600/20 text-white shadow-md shadow-brand-500/10' 
            : 'border-slate-800/80 bg-slate-950 text-slate-300 hover:border-slate-700 hover:bg-slate-900'
        }`;

        card.innerHTML = `
          <div class="flex items-center justify-between">
            <span class="text-[10px] font-mono font-medium ${isActive ? 'text-brand-300' : 'text-slate-500'}">EP ${String(e).padStart(2, '0')}</span>
            ${isActive ? '<i class="fa-solid fa-circle-play text-brand-400 text-xs animate-pulse"></i>' : ''}
          </div>
          <div class="text-xs font-semibold tracking-tight">Capítulo ${e}</div>
        `;

        // Al hacer clic actualiza de inmediato el estado, la vista previa y el código generado
        card.addEventListener('click', () => {
          state.episode = e;
          renderEpisodesGrid();
          updateGenerator();
        });

        episodesGrid.appendChild(card);
      }
    }

    async function fetchSeasonEpisodeCount(tmdbId, seasonNum) {
      try {
        const res = await fetch(`https://api.themoviedb.org/3/tv/${tmdbId}/season/${seasonNum}?api_key=${API_KEY}&language=es-ES`);
        if (res.ok) {
          const data = await res.json();
          if (data.episodes && data.episodes.length) {
            state.episodesInSeason = data.episodes.length;
          }
        }
      } catch(err) {
        state.episodesInSeason = 12;
      }
      renderSeasonsPills();
      renderEpisodesGrid();
      updateGenerator(); // Actualiza preview automáticamente al cambiar de temporada
    }

    // Buscador TMDB en vivo con actualización automática inmediata
    let searchTimeout = null;
    searchInput.addEventListener('input', (e) => {
      const q = e.target.value.trim();
      clearTimeout(searchTimeout);
      if (q.length < 3) {
        searchResults.classList.add('hidden');
        return;
      }
      searchTimeout = setTimeout(async () => {
        try {
          const tmdbType = state.mediaType === 'tv' ? 'tv' : 'movie';
          const res = await fetch(`https://api.themoviedb.org/3/search/${tmdbType}?api_key=${API_KEY}&language=es-ES&query=${encodeURIComponent(q)}`);
          const data = await res.json();
          searchResults.innerHTML = '';
          if (!data.results || data.results.length === 0) {
            searchResults.innerHTML = '<div class="p-3 text-xs text-slate-400">No se encontraron resultados.</div>';
          } else {
            data.results.slice(0, 5).forEach(item => {
              const div = document.createElement('div');
              div.className = 'p-2.5 hover:bg-slate-900 cursor-pointer text-xs border-b border-slate-900 flex justify-between items-center text-slate-200';
              const title = item.title || item.name;
              const date = (item.release_date || item.first_air_date || '').split('-')[0];
              div.innerHTML = `<span>${title} (${date})</span> <span class="font-mono text-brand-400 text-[10px]">ID: ${item.id}</span>`;
              
              // Al seleccionar una película o serie de la lista:
              div.addEventListener('click', async () => {
                mediaIdInput.value = item.id;
                state.mediaId = String(item.id);
                searchInput.value = title;
                searchResults.classList.add('hidden');

                if (state.mediaType === 'tv') {
                  try {
                    const tvRes = await fetch(`https://api.themoviedb.org/3/tv/${item.id}?api_key=${API_KEY}&language=es-ES`);
                    const tvData = await tvRes.json();
                    if (tvData.number_of_seasons) {
                      state.totalSeasons = tvData.number_of_seasons;
                      state.season = 1;
                      state.episode = 1;
                    }
                  } catch(e) {}
                  fetchSeasonEpisodeCount(item.id, 1);
                } else {
                  updateGenerator(); // Actualiza automáticamente la vista previa de la película seleccionada
                }
                
                try {
                  const detailRes = await fetch(`https://api.themoviedb.org/3/${tmdbType}/${item.id}/external_ids?api_key=${API_KEY}`);
                  const detailData = await detailRes.json();
                  if (detailData && detailData.imdb_id) {
                    imdbIdInput.value = detailData.imdb_id;
                    state.imdbId = detailData.imdb_id;
                  }
                } catch(err) {}
              });
              searchResults.appendChild(div);
            });
          }
          searchResults.classList.remove('hidden');
        } catch(err) {
          console.error(err);
        }
      }, 400);
    });

    document.addEventListener('click', (e) => {
      if (!searchInput.contains(e.target) && !searchResults.contains(e.target)) {
        searchResults.classList.add('hidden');
      }
    });

    function getRawServerUrlAndHashId() {
      const mainId = state.mediaId.trim();
      const s = state.season;
      const e = state.episode;
      let rawUrl = '';

      switch(state.server) {
        case 'vimeus':
          rawUrl = state.mediaType === 'movie'
            ? `https://vimeus.net/e/movie?tmdb=${mainId}&${VIMEUS_PARAMS}`
            : `https://vidsrc.net/e/serie?tmdb=${mainId}&se=${s}&ep=${e}&${VIMEUS_PARAMS}`;
          break;

        case 'embed69':
          const imdb = state.imdbId.trim();
          const epStr = String(e).padStart(2, '0');
          rawUrl = state.mediaType === 'movie'
            ? `https://embed69.org/f/${imdb}`
            : `https://embed69.org/f/${imdb}-${s}x${epStr}`;
          break;

        case 'unlimplay':
          rawUrl = state.mediaType === 'movie'
            ? `https://unlimplay.com/f/embed/movie/${mainId}`
            : `https://unlimplay.com/f/embed/tv/${mainId}/${s}/${e}`;
          break;
      }

      return { rawUrl, hashId: mainId };
    }

    function buildPlayerWebUrl() {
      const { rawUrl, hashId } = getRawServerUrlAndHashId();
      const b64Url = btoa(rawUrl);
      
      if (state.mediaType === 'movie') {
        return `${PLAYERWEB_BASE}#movie-${hashId}-${b64Url}`;
      } else {
        const s = state.season;
        const e = state.episode;
        return `${PLAYERWEB_BASE}#tv-${hashId}-${s}-${e}-${b64Url}`;
      }
    }

    function updateGenerator() {
      const playerUrl = buildPlayerWebUrl();
      previewIframe.src = playerUrl;

      if (state.responsive) {
        previewContainer.className = `bg-slate-950 border border-slate-800 rounded-xl overflow-hidden relative aspect-${state.aspectRatio}`;
        previewContainer.style.height = 'auto';
        previewContainer.style.width = '100%';
      } else {
        previewContainer.className = `bg-slate-950 border border-slate-800 rounded-xl overflow-hidden relative`;
        previewContainer.style.width = state.width;
        previewContainer.style.height = state.height;
      }

      if (state.format === 'html') {
        const allowFsAttr = state.allowFullscreen ? ' allowfullscreen' : '';
        const lazyAttr = state.lazyLoading ? ' loading="lazy"' : '';
        const sandboxAttr = state.sandbox ? ' sandbox="allow-scripts allow-same-origin allow-forms"' : '';

        if (state.responsive) {
          const ratioClass = state.aspectRatio === '21-9' ? '21/9' : (state.aspectRatio === '4-3' ? '4/3' : '16/9');
          codeOutput.value = `<!-- CineWick Player Embed -->\n<div style="position: relative; width: 100%; aspect-ratio: ${ratioClass}; overflow: hidden; border-radius: 8px;">\n  <iframe src="${playerUrl}" style="position: absolute; top:0; left:0; width:100%; height:100%; border:0;"${allowFsAttr}${lazyAttr}${sandboxAttr}></iframe>\n</div>`;
        } else {
          codeOutput.value = `<!-- CineWick Player Embed -->\n<iframe src="${playerUrl}" width="${state.width}" height="${state.height}" style="border:0;"${allowFsAttr}${lazyAttr}${sandboxAttr}></iframe>`;
        }
      } else {
        codeOutput.value = `[![Ver en CineWick](https://img.shields.io/badge/CineWick-Ver_Reproductor-4f46e5?style=for-the-badge&logo=playstation)](${playerUrl})`;
      }
    }

    typeMovieBtn.addEventListener('click', () => {
      state.mediaType = 'movie';
      typeMovieBtn.className = 'py-2 px-4 rounded-lg text-sm font-medium transition bg-brand-600 text-white shadow';
      typeTvBtn.className = 'py-2 px-4 rounded-lg text-sm font-medium transition text-slate-400 hover:text-white';
      tvSelectorSection.classList.add('hidden');
      updateGenerator();
    });

    typeTvBtn.addEventListener('click', () => {
      state.mediaType = 'tv';
      typeTvBtn.className = 'py-2 px-4 rounded-lg text-sm font-medium transition bg-brand-600 text-white shadow';
      typeMovieBtn.className = 'py-2 px-4 rounded-lg text-sm font-medium transition text-slate-400 hover:text-white';
      tvSelectorSection.classList.remove('hidden');
      fetchSeasonEpisodeCount(state.mediaId, state.season);
    });

    serverSelect.addEventListener('change', (e) => {
      state.server = e.target.value;
      if (state.server === 'embed69') {
        imdbInputContainer.classList.remove('hidden');
      } else {
        imdbInputContainer.classList.add('hidden');
      }
      updateGenerator();
    });

    mediaIdInput.addEventListener('input', (e) => {
      state.mediaId = e.target.value;
      if (state.mediaType === 'tv') {
        fetchSeasonEpisodeCount(state.mediaId, state.season);
      } else {
        updateGenerator();
      }
    });

    imdbIdInput.addEventListener('input', (e) => {
      state.imdbId = e.target.value;
      updateGenerator();
    });

    refreshPreviewBtn.addEventListener('click', () => {
      previewIframe.src = '';
      setTimeout(() => { updateGenerator(); }, 50);
    });

    responsiveToggle.addEventListener('change', (e) => {
      state.responsive = e.target.checked;
      if (state.responsive) {
        aspectRatioGroup.classList.remove('hidden');
        fixedSizeGroup.classList.add('hidden');
      } else {
        aspectRatioGroup.classList.add('hidden');
        fixedSizeGroup.classList.remove('hidden');
      }
      updateGenerator();
    });

    document.querySelectorAll('.aspect-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        document.querySelectorAll('.aspect-btn').forEach(b => {
          b.className = 'aspect-btn py-1.5 rounded-lg border text-xs font-medium border-slate-800 bg-slate-950 text-slate-400';
        });
        btn.className = 'aspect-btn active py-1.5 rounded-lg border text-xs font-medium border-brand-500 bg-brand-500/10 text-brand-400';
        state.aspectRatio = btn.dataset.aspect;
        updateGenerator();
      });
    });

    widthInput.addEventListener('input', (e) => { state.width = e.target.value; updateGenerator(); });
    heightInput.addEventListener('input', (e) => { state.height = e.target.value; updateGenerator(); });
    allowFullscreenCheck.addEventListener('change', (e) => { state.allowFullscreen = e.target.checked; updateGenerator(); });
    lazyLoadingCheck.addEventListener('change', (e) => { state.lazyLoading = e.target.checked; updateGenerator(); });
    sandboxCheck.addEventListener('change', (e) => { state.sandbox = e.target.checked; updateGenerator(); });

    formatHtmlBtn.addEventListener('click', () => {
      state.format = 'html';
      formatHtmlBtn.className = 'px-2 py-0.5 text-xs rounded text-brand-400 bg-slate-800 font-medium';
      formatMdBtn.className = 'px-2 py-0.5 text-xs rounded text-slate-400 hover:text-white font-medium';
      updateGenerator();
    });

    formatMdBtn.addEventListener('click', () => {
      state.format = 'md';
      formatMdBtn.className = 'px-2 py-0.5 text-xs rounded text-brand-400 bg-slate-800 font-medium';
      formatHtmlBtn.className = 'px-2 py-0.5 text-xs rounded text-slate-400 hover:text-white font-medium';
      updateGenerator();
    });

    deviceDesktopBtn.addEventListener('click', () => {
      state.device = 'desktop';
      previewWrapper.style.maxWidth = '100%';
      deviceDesktopBtn.className = 'p-1.5 text-xs rounded text-brand-400 bg-slate-800';
      deviceMobileBtn.className = 'p-1.5 text-xs rounded text-slate-400 hover:text-white';
    });

    deviceMobileBtn.addEventListener('click', () => {
      state.device = 'mobile';
      previewWrapper.style.maxWidth = '360px';
      deviceMobileBtn.className = 'p-1.5 text-xs rounded text-brand-400 bg-slate-800';
      deviceDesktopBtn.className = 'p-1.5 text-xs rounded text-slate-400 hover:text-white';
    });

    resetFormBtn.addEventListener('click', () => {
      mediaIdInput.value = '550';
      imdbIdInput.value = 'tt0137523';
      searchInput.value = '';
      state.mediaId = '550';
      state.imdbId = 'tt0137523';
      state.season = 1;
      state.episode = 1;
      state.totalSeasons = 1;
      state.episodesInSeason = 12;
      updateGenerator();
    });

    copyCodeBtn.addEventListener('click', () => {
      codeOutput.select();
      navigator.clipboard.writeText(codeOutput.value);
      const toast = document.getElementById('toast');
      toast.classList.remove('opacity-0', 'translate-y-2', 'pointer-events-none');
      setTimeout(() => {
        toast.classList.add('opacity-0', 'translate-y-2', 'pointer-events-none');
      }, 2500);
    });

    updateGenerator();
  </script>
</body>
</html>
